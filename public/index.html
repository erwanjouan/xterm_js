<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link rel="stylesheet" href="/client.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #1e1e1e;
      overflow: hidden;
    }
    #terminal {
      width: 100%;
      height: 100%;
      padding: 8px;
    }

    /* Command Palette */
    #cp-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.45);
    }
    #command-palette {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      background: #252526;
      border: 1px solid #454545;
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    #cp-input {
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #3c3c3c;
      color: #d4d4d4;
      font-family: Menlo, Monaco, "Courier New", monospace;
      font-size: 14px;
      outline: none;
    }
    #cp-input::placeholder { color: #555; }
    #cp-list {
      list-style: none;
      margin: 0;
      padding: 4px 0;
      max-height: 320px;
      overflow-y: auto;
    }
    #cp-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      color: #ccc;
      font-family: Menlo, Monaco, "Courier New", monospace;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }
    #cp-list li:hover { background: #2a2d2e; }
    #cp-list li.cp-selected {
      background: #094771;
      color: #fff;
    }
    .cp-icon {
      flex-shrink: 0;
      width: 16px;
      text-align: center;
      font-size: 11px;
    }
    .cp-icon-cmd  { color: #666; }
    .cp-icon-link { color: #4ec9b0; }
    #cp-list li.cp-selected .cp-icon-cmd  { color: #aaa; }
    #cp-list li.cp-selected .cp-icon-link { color: #9cdcfe; }
    #cp-hint {
      padding: 6px 16px;
      font-size: 11px;
      color: #555;
      font-family: Menlo, Monaco, "Courier New", monospace;
      border-top: 1px solid #3c3c3c;
    }

    /* Options overlay — right 50% panel, full height */
    #opt-panel {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 50vw;
      flex-direction: column;
      background: #1e1e2e;
      border-left: 1px solid #3c3c3c;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      z-index: 50;
      /* pointer-events: auto so the list can scroll; mousedown is cancelled
         in JS to prevent stealing focus from the terminal */
      pointer-events: auto;
    }
    #opt-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 4px 14px;
      background: #252545;
      border-bottom: 1px solid #3c3c3c;
      flex-shrink: 0;
    }
    #opt-title {
      font-family: Menlo, Monaco, "Courier New", monospace;
      font-size: 12px;
      font-weight: bold;
      color: #569cd6;
    }
    #opt-hint {
      font-family: Menlo, Monaco, "Courier New", monospace;
      font-size: 10px;
      color: #555;
    }
    #opt-list {
      overflow-y: auto;
      flex: 1;
      padding: 4px 0;
    }
    .opt-row {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 8px;
      padding: 2px 14px;
      border-radius: 3px;
      min-width: 0;
    }
    .opt-row-match { background: rgba(86, 156, 214, 0.1); }
    .opt-flag {
      font-family: Menlo, Monaco, "Courier New", monospace;
      font-size: 11px;
      color: #4ec9b0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      align-self: start;
      min-width: 0;
    }
    .opt-row-match .opt-flag { color: #dcdcaa; }
    .opt-desc {
      font-family: Menlo, Monaco, "Courier New", monospace;
      font-size: 11px;
      color: #9cdcfe;
      /* truncated in list mode, wrapping in match mode */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opt-row-match .opt-desc {
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <div id="cp-backdrop">
    <div id="command-palette">
      <input id="cp-input" type="text" placeholder="Search commands…" autocomplete="off" spellcheck="false" />
      <ul id="cp-list"></ul>
      <div id="cp-hint">↑↓ navigate &nbsp;·&nbsp; Tab fill &nbsp;·&nbsp; Enter run &nbsp;·&nbsp; Esc close</div>
    </div>
  </div>

  <div id="opt-panel">
    <div id="opt-header">
      <span id="opt-title"></span>
      <span id="opt-hint">options</span>
    </div>
    <div id="opt-list"></div>
  </div>

  <script src="/client.js"></script>
</body>
</html>
